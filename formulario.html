<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Formulario</h1>
    </header>
    <nav class="redirecciones">
        <a href="index.html"><u>Inicio</u></a>
        <a href="mi_historia.html"><u>Mi hisotoria</u></a>
        <a href="mis_suenos.html"><u>Mis sueños</u></a>
    </nav>
    <main>
        <form id="formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" required>
            
            <label for="edad">Edad:</label>
            <input type="number" id="edad" required>

            <label for="ocupacion">Ocupacion:</label>
            <input type="text" id="ocupacion" required>

            <button type="submit" class="botonXd">Agregar</button>
        </form>
        
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Ocupacion</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
            </tbody>
        </table>
    </main>
    <script>
        const formulario = document.getElementById('formulario'); <!-- me estudie que hace cada cosa :v, -->
        const cuerpoTabla = document.getElementById('cuerpoTabla'); <!-- estodos dos, ven a que id estan pendiente -->

        formulario.addEventListener('submit', function(evento) { <!-- en base al "enviar" se ejecuta el siguiente comando -->
            evento.preventDefault();

            const nombre = document.getElementById('nombre').value; <!-- Id del nombre-->
            const apellido = document.getElementById('apellido').value; <!-- Id del apellido -->
            const edad = document.getElementById('edad').value; <!-- Id de la edad -->
            const ocupacion = document.getElementById('ocupacion').value; <!-- Id de la "ocupacion"-->

            const nuevaFila = document.createElement('tr'); <!-- En base a la accion de "enviar" del boton, se crea una nueva fila, en base a lor valores proporcionados en su respectivo lgar -->
            nuevaFila.innerHTML = `
                <td>${nombre}</td>
                <td>${apellido}</td>
                <td>${edad}</td>
                <td>${ocupacion}</td>
            `;

            cuerpoTabla.appendChild(nuevaFila);
            formulario.reset();  <!-- Hace que se resete la tabla al recargar la pagina-->
        });
    </script>
    <footer>
        <p>Creado por: Tomás Lillo</p>
    </footer>
</body>
</html>
