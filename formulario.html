<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<form>
    <fieldset>
        <legend>Cuestionario de HTML</legend>

        <p>
            <label>1. ¿Qué significa HTML?</label><br>
            <input type="radio" name="p1"> HyperText Markup Language<br>
            <input type="radio" name="p1"> HighText Machine Language<br>
            <input type="radio" name="p1"> Hyper Transfer Markup Language
        </p>

        <p>
            <label>2. ¿Cuál etiqueta se utiliza para crear un título principal?</label><br>
            <input type="radio" name="p2"> &lt;title&gt;<br>
            <input type="radio" name="p2"> &lt;h1&gt;<br>
            <input type="radio" name="p2"> &lt;p&gt;
        </p>

        <p>
            <label>3. ¿Qué etiqueta sirve para crear un párrafo?</label><br>
            <input type="radio" name="p3"> &lt;br&gt;<br>
            <input type="radio" name="p3"> &lt;p&gt;<br>
            <input type="radio" name="p3"> &lt;img&gt;
        </p>

        <p>
            <label>4. ¿Qué etiqueta inserta una imagen?</label><br>
            <input type="radio" name="p4"> &lt;img&gt;<br>
            <input type="radio" name="p4"> &lt;table&gt;<br>
            <input type="radio" name="p4"> &lt;form&gt;
        </p>

        <p>
            <label>5. ¿Qué etiqueta crea un enlace?</label><br>
            <input type="radio" name="p5"> &lt;link&gt;<br>
            <input type="radio" name="p5"> &lt;a&gt;<br>
            <input type="radio" name="p5"> &lt;href&gt;
        </p>

        <button type="submit">Enviar</button>
        <button type="reset">Limpiar</button>
    </fieldset>
</form>

</body>
</html>
