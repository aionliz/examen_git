<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar Encargo - Random Play</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Random Play - Nueva Eridu</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="quienessomos.html">Agentes</a></li>
            <li><a href="historiadeusuario.html">Comisiones</a></li>
            <li><a href="formulario.html">Solicitar Encargo</a></li>
            <li><a href="tabla.html">Suministros</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Publicar Comisión en la Inter-Red</h2>
            <form action="#" method="POST">
                <p>
                    <label for="usuario">Usuario de la Inter-Red:</label><br>
                    <input type="text" id="usuario" name="usuario" placeholder="Ej: Proxy_Eridu">
                </p>
                <p>
                    <label for="nivel">Nivel de Inter-Red:</label><br>
                    <input type="text" id="nivel" name="nivel" placeholder="Ej: Nivel 45">
                </p>
                <p>
                    <label for="detalles">Detalles de la Comisión:</label><br>
                    <textarea id="detalles" name="detalles" rows="4" placeholder="Describe el objetivo dentro de la Cavidad..."></textarea>
                </p>
                <button type="submit">Publicar Solicitud</button>
            </form>
        </section>
    </main>

</body>
</html>
